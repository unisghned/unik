<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>surat dadakan/title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose-red: #e63946;
            --rose-dark: #9b2226;
            --env-color: #ff4d6d;
            --env-dark: #c9184a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            background: radial-gradient(circle, #fff5f7 0%, #ffccd5 100%);
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        .master-stage {
            position: relative;
            width: 100%;
            height: 100dvh; /* Mengikuti tinggi layar HP secara akurat */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            padding: 20px;
        }

        /* --- JUDUL RESPONSIF --- */
        .belated-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.2rem, 5vw, 2rem); /* Ukuran font otomatis nyusut di HP */
            color: var(--rose-dark);
            text-align: center;
            margin-bottom: 20px;
            padding: 0 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        /* --- ROSE SYSTEM --- */
        #rose-gate {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s ease;
            width: 100%;
        }

        .rose-bloom {
            position: relative;
            width: 120px; /* Diperkecil sedikit untuk HP */
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .petal {
            position: absolute;
            background: linear-gradient(135deg, var(--rose-red), var(--rose-dark));
            border-radius: 50% 10% 50% 10%;
            transform-origin: center;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
            transition: all 0.8s ease;
        }

        .outer { width: 70px; height: 70px; }
        .p1 { transform: rotate(0deg) translate(35px) rotate(45deg); }
        .p2 { transform: rotate(60deg) translate(35px) rotate(45deg); }
        .p3 { transform: rotate(120deg) translate(35px) rotate(45deg); }
        .p4 { transform: rotate(180deg) translate(35px) rotate(45deg); }
        .p5 { transform: rotate(240deg) translate(35px) rotate(45deg); }
        .p6 { transform: rotate(300deg) translate(35px) rotate(45deg); }

        .mid { width: 55px; height: 55px; z-index: 5; background: linear-gradient(135deg, #ff4d6d, var(--rose-red)); }
        .m1 { transform: rotate(30deg) translate(20px) rotate(45deg); }
        .m2 { transform: rotate(150deg) translate(20px) rotate(45deg); }
        .m3 { transform: rotate(270deg) translate(20px) rotate(45deg); }

        .inner { width: 30px; height: 30px; background: var(--rose-dark); border-radius: 50%; z-index: 10; }

        .stem {
            width: 8px;
            height: 120px;
            background: linear-gradient(to right, #1b4332, #2d6a4f, #1b4332);
            margin-top: 5px;
            position: relative;
            border-radius: 4px;
        }

        .leaf {
            position: absolute;
            width: 35px; height: 18px;
            background: #2d6a4f;
            border-radius: 50% 0 50% 0;
        }
        .l1 { left: -30px; top: 20px; transform: rotate(-30deg); }
        .l2 { right: -30px; top: 45px; transform: rotate(30deg); }

        /* --- ENVELOPE SYSTEM --- */
        #envelope-stage {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 350px;
        }

        .envelope-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 70%; /* Rasio amplop tetap konsisten */
            background: var(--env-color);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.6s ease;
        }

        .flap {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 0;
            border-left: 175px solid transparent; /* Akan disesuaikan via JS */
            border-right: 175px solid transparent;
            border-top: 110px solid var(--env-dark);
            transform-origin: top;
            transition: transform 0.4s ease;
            z-index: 10;
        }

        .pocket {
            position: absolute;
            bottom: 0; width: 100%; height: 100%;
            background: #ff758f;
            clip-path: polygon(0 40%, 50% 100%, 100% 40%, 100% 100%, 0 100%);
            z-index: 8;
            border-radius: 0 0 10px 10px;
        }

        /* --- LETTER RESPONSIVE --- */
        .letter {
            position: absolute;
            bottom: 5%;
            left: 5%;
            right: 5%;
            height: 90%;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            overflow-y: auto; /* Bisa scroll kalau teks panjang */
        }

        .envelope-wrapper.is-open {
            transform: translateY(20%);
        }

        .envelope-wrapper.is-open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.is-open .letter {
            opacity: 1;
            transform: translateY(-55%);
            height: 120%; /* Lebih tinggi dari amplop */
            z-index: 20;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }

        .letter h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--env-dark);
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .letter p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #333;
            margin-bottom: 8px;
        }

        .hint {
            margin-top: 15px;
            font-weight: bold;
            color: var(--env-dark);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.7rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .heart-particle { position: fixed; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>

    <div class="master-stage">
        
        <div id="rose-gate" onclick="openMagic()">
            <h1 class="belated-title">HAPPY BELATED VALENTINE YAAA</h1>
            <div class="rose-bloom">
                <div class="petal outer p1"></div><div class="petal outer p2"></div>
                <div class="petal outer p3"></div><div class="petal outer p4"></div>
                <div class="petal outer p5"></div><div class="petal outer p6"></div>
                <div class="petal mid m1"></div><div class="petal mid m2"></div>
                <div class="petal mid m3"></div>
                <div class="inner"></div>
            </div>
            <div class="stem">
                <div class="leaf l1"></div>
                <div class="leaf l2"></div>
            </div>
            <p class="hint">pencet Bunganya</p>
        </div>

        <div id="envelope-stage">
            <div class="envelope-wrapper" id="env" onclick="this.classList.toggle('is-open')">
                <div class="flap" id="flap"></div>
                <div class="pocket"></div>
                <div class="letter">
                    <h2>Happy Valentine!</h2>
                    <p>SORI BANGET KELUPAAN SURATNYA YAAAA, semoga ini bisa sampe ke ciaaa</p>
                    <p>Happy Valentine! Btw, kamuu keren banget sih tahun ini. Makasih ya udah selalu kasih vibes positif (walau di chat doang wkwkwkwk). I really appreciate that. Makasih yaaa udah mau dengerin curhatan aku yang itu-itu aja (walau kamu sibuk bangett) dan nggak bosen ngelihat tingkah anomali akuu tiap hari di chat.</p>
                    <p>aku tauu minggu minggu inii kamuu agaa sibukk bangett sama lomba dan lain lainnyaa tetepp SEMANGATTT yaaa, semoga hadiahhnya bisaa menghiburr yaaa dan nemenin  kamu , kurang kurangin nangis.</p>
                    <p style="font-weight: bold; color: var(--env-dark); margin-top: 15px;">singkat aja</p>
                </div>
            </div>
            <p class="hint" style="margin-top: 20px;">Klik Amplopnya</p>
        </div>

    </div>

    <script>
        // Sesuaikan ukuran flap amplop dengan lebar layar secara dinamis
        function adjustFlap() {
            const env = document.querySelector('.envelope-wrapper');
            const flap = document.getElementById('flap');
            const width = env.offsetWidth;
            flap.style.borderLeft = `${width / 2}px solid transparent`;
            flap.style.borderRight = `${width / 2}px solid transparent`;
            flap.style.borderTop = `${width * 0.35}px solid var(--env-dark)`;
        }

        window.addEventListener('resize', adjustFlap);
        window.addEventListener('load', adjustFlap);

        function openMagic() {
            const rose = document.getElementById('rose-gate');
            const envelopeStage = document.getElementById('envelope-stage');
            
            adjustFlap();

            for(let i=0; i<20; i++) spawnHeart();

            rose.style.opacity = '0';
            rose.style.transform = 'scale(0) rotate(90deg)';
            
            setTimeout(() => {
                rose.style.display = 'none';
                envelopeStage.style.display = 'flex';
                envelopeStage.animate([
                    { opacity: 0, transform: 'scale(0.8)' },
                    { opacity: 1, transform: 'scale(1)' }
                ], { duration: 500, easing: 'ease-out' });
            }, 500);
        }

        function spawnHeart() {
            const h = document.createElement('div');
            h.className = 'heart-particle';
            h.innerHTML = ['❤️','💖','🌸'][Math.floor(Math.random()*3)];
            h.style.left = '50%';
            h.style.top = '50%';
            h.style.fontSize = Math.random() * 10 + 15 + 'px';
            document.body.appendChild(h);

            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 150 + 50;
            const x = Math.cos(angle) * dist;
            const y = Math.sin(angle) * dist;

            h.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0)`, opacity: 0 }
            ], { duration: 1500, easing: 'ease-out' }).onfinish = () => h.remove();
        }
    </script>
</body>
</html>
